name: keyper-proxy
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: behaviour
      POSTGRES_PASSWORD: behaviour
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U behaviour -d postgres]
      interval: 2s
      timeout: 5s
      retries: 20
    networks: [db]

  # The deployment's image and config. Only the provider differs: Anthropic requests go to the
  # fake API in the runner, and the key is a dummy the test looks for.
  litellm:
    image: ghcr.io/berriai/litellm:v1.103.1
    command: [--config, /app/config.yaml, --port, "4000", --telemetry, "False"]
    environment:
      ANTHROPIC_API_KEY: dummy-provider-key
      ANTHROPIC_API_BASE: http://runner:8090
      LOCAL_API_BASE: ""
      LOCAL_API_KEY: ""
    volumes:
      - ../litellm-config.yaml:/app/config.yaml:ro
    networks: [agent]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  runner:
    build:
      context: .
      dockerfile: Dockerfile.behaviour
      additional_contexts:
        application: ..
    environment:
      DATABASE_URL: postgres://behaviour:behaviour@postgres:5432/postgres
      # Agent mounts need this directory's path on the Docker host.
      KEYPER_TESTS_DIR: ${PWD}
      AGENT_IMAGE: keyper-behaviour-agent:local
      # The gateway used to forward this to the agent. Here it must not reach the agent container.
      ANTHROPIC_API_KEY: dummy-provider-key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./results:/results
    networks: [db, agent]
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      agent-image:
        condition: service_completed_successfully

  agent-image:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    image: keyper-behaviour-agent:local
    command: ["--version"]
    networks: [agent]

networks:
  db:
    internal: true
  agent:
    name: keyper_proxy_agent
