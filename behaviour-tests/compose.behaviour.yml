name: keyper-behaviour
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: behaviour
      POSTGRES_PASSWORD: behaviour
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U behaviour -d postgres]
      interval: 2s
      timeout: 5s
      retries: 20
    networks: [db]

  # The deployment's image and config, holding the provider keys as production does. run.sh sets
  # them: the real keys from .env, or for `./run.sh proxy` a dummy key and the fake Anthropic API in
  # the runner.
  litellm:
    image: ghcr.io/berriai/litellm:v1.103.1
    command: [--config, /app/config.yaml, --port, "4000", --telemetry, "False"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_BASE: ${ANTHROPIC_API_BASE:-}
      LOCAL_API_BASE: ${LOCAL_API_BASE:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
    volumes:
      - ../litellm-config.yaml:/app/config.yaml:ro
    networks: [agent]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  runner:
    build:
      context: .
      dockerfile: Dockerfile.behaviour
      additional_contexts:
        application: ..
    environment:
      DATABASE_URL: postgres://behaviour:behaviour@postgres:5432/postgres
      # Agent mounts need this directory's path on the Docker host.
      KEYPER_TESTS_DIR: ${PWD}
      AGENT_IMAGE: keyper-behaviour-agent:local
      TURN_TIMEOUT_SECONDS: ${TURN_TIMEOUT_SECONDS:-600}
      KEYPERS: ${KEYPERS:-}
      # Empty, like the production gateway. `./run.sh proxy` sets a dummy key here so the proxy
      # test would see it if the agent runtime forwarded it again.
      ANTHROPIC_API_KEY: ${RUNNER_PROVIDER_KEY:-}
      LOCAL_API_KEY: ${RUNNER_PROVIDER_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./results:/results
      - ../AGENTS.md:/config/AGENTS.md:ro
      - ../settings.json:/config/settings.json:ro
      - ./proxy-settings.json:/config/proxy-settings.json:ro
    networks: [db, agent]
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      agent-image:
        condition: service_completed_successfully

  agent-image:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    image: keyper-behaviour-agent:local
    command: ["--version"]
    networks: [agent]

networks:
  db:
    internal: true
  agent:
    name: keyper_behaviour_agent

