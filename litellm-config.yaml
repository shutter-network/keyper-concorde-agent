# Model routing and provider credentials for LiteLLM.
# Pi connects to this proxy through models.json.

model_list:
  # Route claude-* models to Anthropic.
  - model_name: "claude-*"
    litellm_params:
      model: anthropic/claude-*
      api_key: os.environ/ANTHROPIC_API_KEY
      extra_headers:
        anthropic-workspace-id: os.environ/ANTHROPIC_WORKSPACE_ID

  # Route other model IDs to the configured OpenAI-compatible endpoint.
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: os.environ/LOCAL_API_BASE
      api_key: os.environ/LOCAL_API_KEY
